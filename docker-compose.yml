services:
  facsav-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facsav_production
    restart: unless-stopped
    ports:
      - "5527:80"
    depends_on:
      - db
    environment:
      - APP_NAME=Laravel
      - APP_ENV=production
      - APP_KEY=base64:0EhVe9lS5lJrST2jNV7KMhhKLHhTwQiBuAXbQTvVlds=
      - APP_DEBUG=true
      - APP_URL=http://10.10.10.25:5527
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=facture-sav
      - DB_USERNAME=root
      - DB_PASSWORD=secretpassword
      - SESSION_DRIVER=database
      - SESSION_LIFETIME=120
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
 
  db:
    image: mysql:8.0
    container_name: facsav_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: facture-sav
      MYSQL_ROOT_PASSWORD: secretpassword
    volumes:
      - db_data:/var/lib/mysql
 
volumes:
  db_data: