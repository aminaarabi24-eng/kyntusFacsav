version: '3.8'

services:
  facsav-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facsav_production
    restart: unless-stopped
    ports:
      - "5527:80"
    depends_on:
      db:
        condition: service_healthy # Kaytsenna MySQL 7ta y-starti mzyan 3ad kay-lanci Laravel
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://10.10.10.25:5527
      # Configuration MySQL
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=facsav_db
      - DB_USERNAME=facsav_user
      - DB_PASSWORD=facsav_password
      # Autres configs
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs

  db:
    image: mysql:8.0
    container_name: facsav_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: facsav_db
      MYSQL_USER: facsav_user
      MYSQL_PASSWORD: facsav_password
      MYSQL_ROOT_PASSWORD: facsav_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: # Volume bach la base de données matmchich ila ta7 l'container